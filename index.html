<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RozvrhUniza</title>
    <base href="/UnizaRozvrhViewer/" />

    <!-- Theme bootstrap: set initial theme before first paint -->
    <script>
        (function () {
            const storageKey = 'theme-preference';
            const persisted = localStorage.getItem(storageKey);
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = persisted || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            window.theme = {
                get: () => document.documentElement.getAttribute('data-theme') || 'light',
                set: (t) => { document.documentElement.setAttribute('data-theme', t); localStorage.setItem(storageKey, t); return t; },
                toggle: () => {
                    const next = (window.theme.get() === 'dark') ? 'light' : 'dark';
                    return window.theme.set(next);
                }
            };
        })();
    </script>

    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="RozvrhUniza.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Bootstrap JS bundle (navbar toggler on mobile) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
                    .then(function (registration) {
                        // If there's an existing waiting worker, tell it to activate immediately
                        if (registration.waiting) {
                            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                        }

                        // When a new service worker is found, ask it to skip waiting when installed
                        registration.addEventListener('updatefound', function () {
                            const newWorker = registration.installing;
                            if (newWorker) {
                                newWorker.addEventListener('statechange', function () {
                                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                                    }
                                });
                            }
                        });
                    })
                    .catch(function (err) { console.warn('Service worker registration failed:', err); });

                // Reload the page when the new SW takes control
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', function () {
                    if (refreshing) return;
                    refreshing = true;
                    window.location.reload();
                });
            });
        }
    </script>
    <script>
        window.downloadFileFromBytes = (fileName, contentType, base64Data) => {
            const link = document.createElement('a');
            link.download = fileName;
            link.href = `data:${contentType};base64,${base64Data}`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
    <script src="brotliloader.min.js" type="module"></script>
</body>

</html>
